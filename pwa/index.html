<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Nod</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-screen="connecting">
  <header class="bar">
    <span id="conn" class="conn" data-ok="0">Offline</span>
    <span id="replay-badge" class="badge replay" hidden title="Mock mode: replaying recorded robot runs">REPLAY</span>
    <span id="fps-warn" class="badge warn" hidden>Low camera frame rate</span>
    <span id="mic-dot" class="badge mic" hidden>Mic on</span>
    <video id="preview" class="preview" autoplay muted playsinline hidden aria-label="Camera preview"></video>
  </header>

  <main id="screen" aria-live="off"></main>
  <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <div id="noface" class="overlay noface" hidden role="status">
    <h1>I can't see you</h1>
    <p>Move into view of the camera</p>
  </div>

  <div id="toast" class="toast" hidden role="status"></div>

  <footer class="controls">
    <button id="stop-btn" type="button" class="stop-btn" aria-label="Stop the robot">STOP</button>
    <div class="row">
      <button id="menu-btn" type="button" class="secondary">Options</button>
      <form id="utter-form" class="utter" autocomplete="off">
        <label for="utter-text" class="sr-only">Type what you need</label>
        <input id="utter-text" type="text" placeholder="Type what you need (caregiver)" enterkeyhint="send">
        <button type="submit" class="secondary">Send</button>
      </form>
    </div>
    <p class="keys">Keyboard: Left/Right turn &middot; hold Enter long blink &middot; B brow raise &middot; Space STOP</p>
    <p class="status-line"><span id="face-status">Camera: off</span> &middot; <span id="kws-status">Voice stop: off</span></p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
