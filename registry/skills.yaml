# ------------------------------------------------------------------ custom policy skill (ours)

- skill_id: bowl_to_user
  ver: 1
  kind: policy
  label: "Bring the bowl to me"
  scene_id: libero_goal_v1
  # Fine-tuned from the libero_goal checkpoint on LIBERO-Goal plus our scripted demos (design 9.1 week 3).
  policy: {checkpoint: "nod/GR00T-N1.7-LIBERO-nod/libero_goal_handover", embodiment: LIBERO_PANDA,
           instruction: "bring the bowl to me", n_action_steps: 8, max_steps: 400}
  goal_ref: nod/bring_the_bowl_to_me
  # Trained from the bowl on the table and on the plate, with or without cheese (chain B).
  pre: ["not on(akita_black_bowl_1,main_table_handover_region)",
        "not on(akita_black_bowl_1,wooden_cabinet_1_top_side)",
        "not in(akita_black_bowl_1,wooden_cabinet_1_top_region)",
        "not on(akita_black_bowl_1,flat_stove_1_cook_region)"]
  effects: ["on(akita_black_bowl_1,main_table_handover_region)",
            "not on(akita_black_bowl_1,plate_1)"]
  objects: [akita_black_bowl_1]
  risk: low
  confirm: single          # R14 adds a double confirm on first use per session
  near_user: true
  custom: true
  est_s: 12
  cosmos:
    pre: "Is the black bowl on the table or on the plate, within reach of the robot?"
    post: "Is the black bowl at the front edge of the table, close to the person?"
  undo: null
  stats: {}

