- skill_id: return_home
  ver: 1
  kind: scripted
  label: "Return the arm home"
  scene_id: libero_goal_v1
  scripted: {script: return_home, max_steps: 160}
  pre: []
  effects: []              # arm motion only; no world atoms change (exempt from R5)
  objects: []
  risk: low
  confirm: single
  offer: false             # run by the gateway between skills, never offered as a card
  est_s: 4
  cosmos: null
  undo: null
  stats: {}

- skill_id: reset_scene
  ver: 1
  kind: scripted
  label: "Reset the table"
  scene_id: libero_goal_v1
  scripted: {script: reset_scene, max_steps: 160}
  pre: []
  # Restores the initial LIBERO-Goal layout: every registry atom becomes false.
  effects: ["not on(akita_black_bowl_1,plate_1)",
            "not on(cream_cheese_1,akita_black_bowl_1)",
            "not on(wine_bottle_1,wine_rack_1_top_region)",
            "not on(wine_bottle_1,wooden_cabinet_1_top_side)",
            "not on(akita_black_bowl_1,wooden_cabinet_1_top_side)",
            "not in(akita_black_bowl_1,wooden_cabinet_1_top_region)",
            "not open(wooden_cabinet_1_top_region)",
            "not open(wooden_cabinet_1_middle_region)",
            "not on(plate_1,main_table_stove_front_region)",
            "not on(akita_black_bowl_1,flat_stove_1_cook_region)",
            "not turnon(flat_stove_1)",
            "not on(akita_black_bowl_1,main_table_handover_region)"]
  objects: []
  risk: low
  confirm: single
  offer: false             # caregiver lease only, via POST /api/scene/reset (design 4.3)
  est_s: 3
  cosmos:
    pre: null
    post: "Are the bowl, plate, cream cheese and wine bottle all on the table, with every drawer closed and the stove off?"
  undo: null
  stats: {}

