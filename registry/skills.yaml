# Nod skill registry (design 4.2.3). Loaded by nod_protocol.load_skills into SkillSpec models.
#
# Atoms are lowercased LIBERO BDDL predicates in the form pred(arg,arg), no spaces.
# The sim oracle reports every atom used below (nod_protocol.registry_atoms lists them):
#   on(akita_black_bowl_1,plate_1)                              bowl on plate
#   on(cream_cheese_1,akita_black_bowl_1)                       cheese in bowl
#   on(wine_bottle_1,wine_rack_1_top_region)                    bottle on rack
#   on(wine_bottle_1,wooden_cabinet_1_top_side)                 bottle on top of cabinet
#   on(akita_black_bowl_1,wooden_cabinet_1_top_side)            bowl on top of cabinet
#   in(akita_black_bowl_1,wooden_cabinet_1_top_region)          bowl inside the top drawer
#   open(wooden_cabinet_1_top_region)                           top drawer open
#   open(wooden_cabinet_1_middle_region)                        middle drawer open
#   on(plate_1,main_table_stove_front_region)                   plate pushed to the stove front
#   on(akita_black_bowl_1,flat_stove_1_cook_region)             bowl on the stove
#   turnon(flat_stove_1)                                        stove on
#   on(akita_black_bowl_1,main_table_handover_region)           bowl at the user (custom region)
# In the initial LIBERO-Goal layout every one of these atoms is false.
#
# Precondition policy (why the "pre" lists look the way they do):
#  1. The bowl is in exactly one place. The five bowl places are: plate, top of cabinet,
#     top drawer, stove, handover. A learned skill that picks the bowl requires the bowl
#     to be at its training start (on the table, none of those places), because every
#     LIBERO-Goal demo starts from the initial layout. Exceptions are the snack chain
#     (chain B): cheese_in_bowl accepts a bowl on the plate, and our custom bowl_to_user
#     is trained from both the table and the plate and accepts cheese in the bowl.
#  2. Do not move a bowl that holds cheese (design 4.2.3), except bowl_to_user.
#  3. Nothing goes in or onto a place that is already taken (top of cabinet holds one item).
#  4. Hazards: never put a bowl on a lit stove, never light a stove with a bowl on it,
#     never reach next to a lit stove to push the plate.
#  5. Drawers: an open drawer sticks out in front of the one above or below it, which
#     the training demos never show, so opening one drawer requires the other closed.
#  6. Effects are the BDDL goal atom (what the oracle checks after the run), plus delete
#     effects ("not ...") wherever a precondition allows the object to start elsewhere.
#  Chain A (bottle_on_rack, open_middle_drawer, cheese_in_bowl, plate_to_stove_front) and
#  chain B (bowl_on_plate, cheese_in_bowl, bowl_to_user) pass a symbolic rollout from the
#  initial layout; protocol/tests/test_registry.py checks this and a list of infeasible plans.
#
# Fields beyond the 4.2.3 example (scripted, home, objects, custom, enabled, offer, est_s)
# are documented in docs/DEVIATIONS.md. stats: {} is filled from registry/stats/latest.json.

# ------------------------------------------------------------------ LIBERO-Goal policy skills

- skill_id: bowl_on_plate
  ver: 1
  kind: policy
  label: "Put the bowl on the plate"
  scene_id: libero_goal_v1
  policy: {checkpoint: "GR00T-N1.7-LIBERO/libero_goal", embodiment: LIBERO_PANDA,
           instruction: "put the bowl on the plate", n_action_steps: 8, max_steps: 400}
  goal_ref: libero_goal/put_the_bowl_on_the_plate
  pre: ["not on(akita_black_bowl_1,plate_1)",
        "not in(akita_black_bowl_1,wooden_cabinet_1_top_region)",
        "not on(cream_cheese_1,akita_black_bowl_1)",
        "not on(akita_black_bowl_1,wooden_cabinet_1_top_side)",
        "not on(akita_black_bowl_1,flat_stove_1_cook_region)",
        "not on(akita_black_bowl_1,main_table_handover_region)",
        "not on(plate_1,main_table_stove_front_region)"]
  effects: ["on(akita_black_bowl_1,plate_1)"]
  objects: [akita_black_bowl_1, plate_1]
  risk: low
  confirm: single
  near_user: false
  est_s: 10
  cosmos:
    pre: "Is there a black bowl on the table and is the plate empty?"
    post: "Is the black bowl resting on the plate?"
  undo: null
  stats: {}

